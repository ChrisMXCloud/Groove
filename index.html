<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <title>XtremeSound Play</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <link
    rel="icon"
    href="XS.png"
    type="image/x-icon"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js">
  </script>


<style>

/* =====================================================
   VARIABLES
===================================================== */

:root {

  --bg-color: #000;

  --bg-color-2: #000;

  --text-color: #fff;

  --accent-color: #fff;

  --bg-secondary: #000;

  --cover-background: none;

}


/* =====================================================
   RESET
===================================================== */

* {

  box-sizing: border-box;

}


/* =====================================================
   BODY
===================================================== */

body {

  margin: 0;

  font-family: 'Segoe UI', sans-serif;

  background:
    linear-gradient(
      135deg,
      var(--bg-color),
      var(--bg-color-2)
    );

  color: var(--text-color);

  height: 100vh;

  display: flex;

  overflow: hidden;

  transition:
    background 1.5s ease,
    color 0.5s ease;

}


/* =====================================================
   FONDO DIFUMINADO
===================================================== */

body.has-cover::before {

  content: "";

  position: fixed;

  inset: 0;

  background-image:
    var(--cover-background);

  background-size: cover;

  background-position: center;

  background-repeat: no-repeat;

  opacity: 0.18;

  filter: blur(50px);

  z-index: -1;

  pointer-events: none;

  transition:
    background-image 1.5s ease-in-out,
    opacity 1.5s ease;

}


/* =====================================================
   CONTENIDO PRINCIPAL
===================================================== */

.main {

  flex: 1;

  display: flex;

  flex-direction: row;

  justify-content: center;

  align-items: center;

  padding: 20px;

  gap: 20px;

}


/* =====================================================
   REPRODUCTOR
===================================================== */

.now-playing {

  display: flex;

  flex-direction: column;

  align-items: center;

  width: 350px;

}


/* =====================================================
   PORTADA
===================================================== */

.cover {

  width: 280px;

  height: 280px;

  background: #000;

  border-radius: 15px;

  background-size: cover;

  background-position: center;

  margin-bottom: 20px;

  box-shadow:
    0 0 25px rgba(255,255,255,0.35);

  transition:
    all 0.5s ease;

  position: relative;

  overflow: hidden;

}


/* =====================================================
   PORTADA REAL
===================================================== */

.cover.real-cover {

  background-repeat: no-repeat;

}


/* =====================================================
   VISUALIZADOR
===================================================== */

.visualizer {

  position: absolute;

  left: 0;

  top: 0;

  width: 100%;

  height: 100%;

  display: none;

  pointer-events: none;

}


/* =====================================================
   PORTADA IMPROVISADA
===================================================== */

.cover.no-cover {

  background:
    radial-gradient(
      circle at center,
      #222 0%,
      #080808 45%,
      #000 100%
    );

}


/* =====================================================
   VISUALIZADOR ACTIVO
===================================================== */

.cover.no-cover .visualizer {

  display: block;

}


/* =====================================================
   ANIMACIÓN DE PORTADA
===================================================== */

.cover.playing {

  animation:
    zoomInOut 3s ease infinite;

}


@keyframes zoomInOut {

  0%, 100% {

    transform: scale(1);

  }

  50% {

    transform: scale(1.05);

  }

}


/* =====================================================
   INFORMACIÓN
===================================================== */

.track-title {

  font-size: 26px;

  font-weight: bold;

  margin-bottom: 5px;

  text-align: center;

  text-shadow:
    0 0 10px rgba(255,255,255,0.5);

}


.track-artist {

  font-size: 16px;

  color: #fff;

  margin-bottom: 15px;

  text-align: center;

  text-shadow:
    0 0 6px rgba(255,255,255,0.4);

}


/* =====================================================
   CONTROLES
===================================================== */

.controls {

  display: flex;

  justify-content: center;

  gap: 15px;

  flex-wrap: wrap;

  margin-bottom: 15px;

}


.controls button {

  width: 62px;

  height: 58px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 26px;

  background:
    linear-gradient(
      145deg,
      #000,
      #000
    );

  border: none;

  border-radius: 12px;

  color: #fff;

  cursor: pointer;

  padding: 12px;

  box-shadow:
    4px 4px 8px rgba(0,0,0,0.5),
    -4px -4px 8px rgba(255,255,255,0.2);

  transition:
    all 0.3s ease;

}


.controls button img {

  width: 30px;

  height: 30px;

  object-fit: contain;

  display: block;

  pointer-events: none;

}


.controls button:hover {

  background:
    linear-gradient(
      145deg,
      #fff,
      #000
    );

  transform: scale(1.1);

}


.controls button:active {

  transform: scale(0.95);

  box-shadow:
    inset 2px 2px 6px rgba(0,0,0,0.5),
    inset -2px -2px 6px rgba(255,255,255,0.2);

}


/* =====================================================
   BOTONES ESPECIALES
===================================================== */

.special-btn {

  font-size: 16px;

  background:
    linear-gradient(
      145deg,
      #000,
      #000
    );

  border: none;

  border-radius: 12px;

  padding: 12px 20px;

  color: #fff;

  cursor: pointer;

  box-shadow:
    4px 4px 8px rgba(0,0,0,0.5),
    -4px -4px 8px rgba(255,255,255,0.2);

  transition:
    all 0.3s ease;

}


.special-btn:hover {

  background:
    linear-gradient(
      145deg,
      #fff,
      #000
    );

  transform: scale(1.05);

  color: #fff;

  box-shadow:
    2px 2px 8px rgba(0,0,0,0.6),
    -2px -2px 8px rgba(255,255,255,0.3);

}


.special-btn:active {

  transform: scale(0.95);

}


.folder-buttons {

  display: flex;

  flex-direction: column;

  gap: 12px;

  margin-top: 10px;

  align-items: center;

}


/* =====================================================
   PLAYLIST
===================================================== */

#playlistContainer {

  position: absolute;

  right: 20px;

  top: 20px;

  bottom: 20px;

  width: 320px;

  background: #000;

  border-radius: 12px;

  padding: 10px;

  overflow-y: auto;

  box-shadow:
    0 0 15px rgba(255,255,255,0.15);

}


.playlist-item {

  display: flex;

  align-items: center;

  gap: 10px;

  padding: 6px 4px;

  border-radius: 8px;

  transition: 0.3s;

  cursor: pointer;

}


.playlist-item:hover {

  background:
    rgba(255,255,255,0.2);

}


.playlist-item.active {

  background:
    rgba(255,255,255,0.4);

}


.playlist-item img {

  width: 40px;

  height: 40px;

  border-radius: 6px;

  object-fit: cover;

}


.playlist-item .text {

  display: flex;

  flex-direction: column;

  font-size: 14px;

  overflow: hidden;

}


.playlist-item .text .song-title {

  font-weight: bold;

  color: #fff;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}


.playlist-item .text .song-artist {

  color: #fff;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 1000px) {

  #playlistContainer {

    display: none;

  }

}

</style>

</head>


<body>


<div class="main">


  <div
    class="now-playing"
    id="nowPlaying"
  >


    <!-- =================================================
         PORTADA
    ================================================== -->

    <div
      class="cover no-cover"
      id="cover"
    >

      <canvas
        id="visualizer"
        class="visualizer"
      ></canvas>

    </div>


    <!-- =================================================
         TÍTULO
    ================================================== -->

    <div
      class="track-title"
      id="title"
    >

      Sin canción

    </div>


    <!-- =================================================
         ARTISTA
    ================================================== -->

    <div
      class="track-artist"
      id="artist"
    >

      Unknown

    </div>


    <!-- =================================================
         CONTROLES
    ================================================== -->

    <div class="controls">


      <button
        id="prev"
        title="Anterior"
      >

        <img
          src="./complements/prev.png"
          alt="Anterior"
        >

      </button>


      <button
        id="play"
        title="Reproducir"
      >

        <img
          src="./complements/play.png"
          alt="Reproducir"
        >

      </button>


      <button
        id="next"
        title="Siguiente"
      >

        <img
          src="./complements/next.png"
          alt="Siguiente"
        >

      </button>


      <button
        id="repeat"
        title="Repetir"
      >

        <img
          src="./complements/repeat-off.png"
          alt="Repetición desactivada"
        >

      </button>


    </div>


    <!-- =================================================
         CARPETA
    ================================================== -->

    <div class="folder-buttons">


      <button
        id="selectFolderBtn"
        class="special-btn"
      >

        Seleccionar Carpeta

      </button>


      <input
        type="file"
        id="folderInput"
        webkitdirectory
        multiple
        style="display:none;"
      >


      <button
        id="installBtn"
        class="special-btn"
        style="display:none;"
      >

        ➕ Instalar App

      </button>


    </div>


  </div>


  <!-- ===================================================
       PLAYLIST
  ==================================================== -->

  <div id="playlistContainer">

    <div
      style="text-align:center; color:#fff;"
    >

      No hay canciones seleccionadas

    </div>

  </div>


  <!-- ===================================================
       AUDIO
  ==================================================== -->

  <audio
    id="player"
  ></audio>


</div>



<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const player =
  document.getElementById('player');


const cover =
  document.getElementById('cover');


const title =
  document.getElementById('title');


const artist =
  document.getElementById('artist');


const playBtn =
  document.getElementById('play');


const nextBtn =
  document.getElementById('next');


const prevBtn =
  document.getElementById('prev');


const repeatBtn =
  document.getElementById('repeat');


const folderInput =
  document.getElementById('folderInput');


const selectFolderBtn =
  document.getElementById('selectFolderBtn');


const playlistContainer =
  document.getElementById('playlistContainer');


const visualizerCanvas =
  document.getElementById('visualizer');


/* =====================================================
   ICONOS
===================================================== */

const ICONS = {

  prev:
    './complements/prev.png',

  play:
    './complements/play.png',

  pause:
    './complements/pause.png',

  next:
    './complements/next.png',

  repeat:
    './complements/repeat.png',

  repeatOne:
    './complements/repeat-one.png',

  repeatOff:
    './complements/repeat-off.png'

};


/* =====================================================
   ESTADO
===================================================== */

let playlist = [];

let currentIndex = 0;

let isPlaying = false;

let repeatMode = 'off';


/* =====================================================
   AUDIO VISUALIZER
===================================================== */

let audioContext = null;

let analyser = null;

let sourceNode = null;

let visualizerAnimation = null;


/* =====================================================
   INICIALIZAR AUDIO CONTEXT
===================================================== */

function initializeAudioVisualizer() {

  if (audioContext)
    return;


  try {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    analyser =
      audioContext.createAnalyser();


    /*
      FFT alto para obtener
      detalle de frecuencias.
    */

    analyser.fftSize =
      2048;


    analyser.smoothingTimeConstant =
      0.82;


    sourceNode =
      audioContext.createMediaElementSource(
        player
      );


    sourceNode.connect(
      analyser
    );


    analyser.connect(
      audioContext.destination
    );

  }

  catch (error) {

    console.warn(
      'No se pudo inicializar el visualizador:',
      error
    );

  }

}


/* =====================================================
   DIBUJAR VISUALIZADOR
===================================================== */

function drawVisualizer() {

  if (
    !analyser ||
    !visualizerCanvas
  ) {

    return;

  }


  const canvas =
    visualizerCanvas;


  const ctx =
    canvas.getContext(
      '2d'
    );


  const rect =
    canvas.getBoundingClientRect();


  const dpr =
    window.devicePixelRatio ||
    1;


  const width =
    rect.width;


  const height =
    rect.height;


  if (
    canvas.width !==
    width * dpr
  ) {

    canvas.width =
      width * dpr;

  }


  if (
    canvas.height !==
    height * dpr
  ) {

    canvas.height =
      height * dpr;

  }


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  /*
    Limpiar.
  */

  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  /*
    Obtener frecuencias.
  */

  const bufferLength =
    analyser.frequencyBinCount;


  const dataArray =
    new Uint8Array(
      bufferLength
    );


  analyser.getByteFrequencyData(
    dataArray
  );


  /*
    ==============================================
    LÍNEA PRINCIPAL
    ==============================================
  */

  ctx.beginPath();


  /*
    CENTRO EXACTO DEL CUADRO
  */

  const centerY =
    height / 2;


  const points =
    160;


  const sliceWidth =
    width / (points - 1);


  let x = 0;


  for (
    let i = 0;
    i < points;
    i++
  ) {

    const dataIndex =
      Math.floor(
        i *
        (
          bufferLength /
          points
        )
      );


    const value =
      dataArray[dataIndex] ||
      0;


    /*
      Amplitud principal.
    */

    const amplitude =
      (
        value / 255
      ) * 95;


    /*
      Curva suave que converge
      hacia el centro.
    */

    const y =
      centerY -
      amplitude *
      Math.sin(
        (
          i /
          (points - 1)
        ) *
        Math.PI
      );


    if (
      i === 0
    ) {

      ctx.moveTo(
        x,
        y
      );

    }

    else {

      ctx.lineTo(
        x,
        y
      );

    }


    x += sliceWidth;

  }


  /*
    Línea blanca.
  */

  ctx.lineWidth =
    2;


  ctx.strokeStyle =
    '#ffffff';


  ctx.shadowColor =
    'rgba(255,255,255,0.95)';


  ctx.shadowBlur =
    10;


  ctx.stroke();


  /*
    ==============================================
    SEGUNDA LÍNEA
    ==============================================
  */

  ctx.beginPath();


  x = 0;


  for (
    let i = 0;
    i < points;
    i++
  ) {

    const dataIndex =
      Math.floor(
        i *
        (
          bufferLength /
          points
        )
      );


    const value =
      dataArray[dataIndex] ||
      0;


    const amplitude =
      (
        value / 255
      ) * 45;


    const y =
      centerY +
      amplitude *
      Math.sin(
        (
          i /
          (points - 1)
        ) *
        Math.PI
      );


    if (
      i === 0
    ) {

      ctx.moveTo(
        x,
        y
      );

    }

    else {

      ctx.lineTo(
        x,
        y
      );

    }


    x += sliceWidth;

  }


  ctx.lineWidth =
    1;


  ctx.strokeStyle =
    'rgba(255,255,255,0.35)';


  ctx.shadowColor =
    'rgba(255,255,255,0.5)';


  ctx.shadowBlur =
    5;


  ctx.stroke();


  /*
    Continuar animación.
  */

  visualizerAnimation =
    requestAnimationFrame(
      drawVisualizer
    );

}


/* =====================================================
   INICIAR VISUALIZADOR
===================================================== */

function startVisualizer() {

  initializeAudioVisualizer();


  if (
    audioContext &&
    audioContext.state ===
    'suspended'
  ) {

    audioContext.resume();

  }


  if (
    !visualizerAnimation
  ) {

    drawVisualizer();

  }

}


/* =====================================================
   DETENER VISUALIZADOR
===================================================== */

function stopVisualizer() {

  if (
    visualizerAnimation
  ) {

    cancelAnimationFrame(
      visualizerAnimation
    );

    visualizerAnimation =
      null;

  }

}


/* =====================================================
   CAMBIAR ICONO
===================================================== */

function setButtonIcon(
  button,
  src,
  alt
) {

  const img =
    button.querySelector(
      'img'
    );


  if (!img)
    return;


  img.src =
    src;


  img.alt =
    alt;

}


/* =====================================================
   OBTENER COLORES DE PORTADA
===================================================== */

function getCoverColors(
  imageURL
) {

  return new Promise(
    (resolve) => {

      const img =
        new Image();


      if (
        !imageURL.startsWith(
          'data:'
        )
      ) {

        img.crossOrigin =
          'Anonymous';

      }


      img.onload =
        function() {

          try {

            const canvas =
              document.createElement(
                'canvas'
              );


            const ctx =
              canvas.getContext(
                '2d',
                {
                  willReadFrequently:
                    true
                }
              );


            const size =
              100;


            canvas.width =
              size;


            canvas.height =
              size;


            ctx.drawImage(
              img,
              0,
              0,
              size,
              size
            );


            const imageData =
              ctx.getImageData(
                0,
                0,
                size,
                size
              ).data;


            let r = 0;

            let g = 0;

            let b = 0;

            let count = 0;


            for (
              let i = 0;
              i <
              imageData.length;
              i += 4
            ) {

              const red =
                imageData[i];


              const green =
                imageData[i + 1];


              const blue =
                imageData[i + 2];


              const alpha =
                imageData[i + 3];


              if (
                alpha < 100
              )
                continue;


              r += red;

              g += green;

              b += blue;

              count++;

            }


            if (
              !count
            ) {

              resolve({

                color1:
                  '#000000',

                color2:
                  '#000000'

              });

              return;

            }


            r =
              Math.round(
                r / count
              );


            g =
              Math.round(
                g / count
              );


            b =
              Math.round(
                b / count
              );


            const color1 =
              `rgb(${r},${g},${b})`;


            const r2 =
              Math.max(
                0,
                Math.round(
                  r * 0.45
                )
              );


            const g2 =
              Math.max(
                0,
                Math.round(
                  g * 0.45
                )
              );


            const b2 =
              Math.max(
                0,
                Math.round(
                  b * 0.45
                )
              );


            const color2 =
              `rgb(${r2},${g2},${b2})`;


            resolve({

              color1,

              color2

            });

          }

          catch (error) {

            console.warn(
              'No se pudieron obtener los colores:',
              error
            );


            resolve({

              color1:
                '#000000',

              color2:
                '#000000'

            });

          }

        };


      img.onerror =
        function() {

          resolve({

            color1:
              '#000000',

            color2:
              '#000000'

          });

        };


      img.src =
        imageURL;

    }
  );

}


/* =====================================================
   FONDO DINÁMICO
===================================================== */

async function updateBackground(
  imageURL
) {

  if (
    !imageURL
  ) {

    document.documentElement
      .style
      .setProperty(
        '--bg-color',
        '#000'
      );


    document.documentElement
      .style
      .setProperty(
        '--bg-color-2',
        '#000'
      );


    document.documentElement
      .style
      .setProperty(
        '--cover-background',
        'none'
      );


    document.body
      .classList
      .remove(
        'has-cover'
      );


    document.body.style.background =
      '#000';


    return;

  }


  const colors =
    await getCoverColors(
      imageURL
    );


  document.documentElement
    .style
    .setProperty(
      '--bg-color',
      colors.color1
    );


  document.documentElement
    .style
    .setProperty(
      '--bg-color-2',
      colors.color2
    );


  document.documentElement
    .style
    .setProperty(
      '--cover-background',
      `url("${imageURL}")`
    );


  document.body
    .classList
    .add(
      'has-cover'
    );


  document.body.style.background =
    `linear-gradient(
      135deg,
      ${colors.color1},
      ${colors.color2}
    )`;

}


/* =====================================================
   PORTADA IMPROVISADA
===================================================== */

function showNoCover() {

  cover
    .classList
    .add(
      'no-cover'
    );


  cover
    .classList
    .remove(
      'real-cover'
    );


  cover.style.backgroundImage =
    'none';


  if (
    isPlaying
  ) {

    startVisualizer();

  }

}


/* =====================================================
   PORTADA REAL
===================================================== */

function showRealCover(
  imageURL
) {

  cover
    .classList
    .remove(
      'no-cover'
    );


  cover
    .classList
    .add(
      'real-cover'
    );


  cover.style.backgroundImage =
    `url("${imageURL}")`;


  stopVisualizer();

}


/* =====================================================
   REPRODUCIR
===================================================== */

function playTrack() {

  if (
    !playlist.length
  )
    return;


  initializeAudioVisualizer();


  if (
    audioContext &&
    audioContext.state ===
    'suspended'
  ) {

    audioContext.resume();

  }


  player.play()
    .then(
      () => {

        isPlaying =
          true;


        setButtonIcon(
          playBtn,
          ICONS.pause,
          'Pausar'
        );


        cover.classList.add(
          'playing'
        );


        /*
          Visualizador solamente
          cuando no hay portada.
        */

        if (
          !playlist[currentIndex].cover
        ) {

          startVisualizer();

        }


        updatePlaylistUI();

      }
    )
    .catch(
      error => {

        console.warn(
          'No se pudo reproducir:',
          error
        );

      }
    );

}


/* =====================================================
   PAUSAR
===================================================== */

function pauseTrack() {

  player.pause();


  isPlaying =
    false;


  setButtonIcon(
    playBtn,
    ICONS.play,
    'Reproducir'
  );


  cover.classList.remove(
    'playing'
  );


  stopVisualizer();


  updatePlaylistUI();

}


/* =====================================================
   CARGAR CANCIÓN
===================================================== */

function loadTrack(
  index
) {

  const file =
    playlist[index];


  if (!file)
    return;


  const url =
    URL.createObjectURL(
      file.file
    );


  player.src =
    url;


  title.textContent =
    file.title;


  artist.textContent =
    file.artist;


  /*
    PORTADA
  */

  if (
    file.cover
  ) {

    showRealCover(
      file.cover
    );


    updateBackground(
      file.cover
    );

  }

  else {

    showNoCover();


    updateBackground(
      null
    );

  }


  cover.classList.remove(
    'playing'
  );


  /*
    MEDIA SESSION
  */

  if (
    'mediaSession' in navigator
  ) {

    navigator.mediaSession.metadata =
      new MediaMetadata({

        title:
          file.title,

        artist:
          file.artist,

        album:
          'XtremeSound Play',

        artwork:
          file.cover
            ? [
                {

                  src:
                    file.cover,

                  sizes:
                    '512x512',

                  type:
                    'image/jpeg'

                }
              ]
            : []

      });


    navigator.mediaSession.setActionHandler(
      'play',
      () =>
        playTrack()
    );


    navigator.mediaSession.setActionHandler(
      'pause',
      () =>
        pauseTrack()
    );


    navigator.mediaSession.setActionHandler(
      'previoustrack',
      () => {

        if (
          currentIndex > 0
        ) {

          currentIndex--;

          loadTrack(
            currentIndex
          );

          playTrack();

        }

      }
    );


    navigator.mediaSession.setActionHandler(
      'nexttrack',
      () => {

        if (
          currentIndex + 1 <
          playlist.length
        ) {

          currentIndex++;

          loadTrack(
            currentIndex
          );

          playTrack();

        }

      }
    );

  }

}


/* =====================================================
   PLAY / PAUSA
===================================================== */

playBtn.addEventListener(
  'click',
  () => {

    if (
      isPlaying
    ) {

      pauseTrack();

    }

    else {

      playTrack();

    }

  }
);


/* =====================================================
   SIGUIENTE
===================================================== */

nextBtn.addEventListener(
  'click',
  () => {

    if (
      currentIndex + 1 <
      playlist.length
    ) {

      currentIndex++;

      loadTrack(
        currentIndex
      );

      playTrack();

    }

  }
);


/* =====================================================
   ANTERIOR
===================================================== */

prevBtn.addEventListener(
  'click',
  () => {

    if (
      currentIndex > 0
    ) {

      currentIndex--;

      loadTrack(
        currentIndex
      );

      playTrack();

    }

  }
);


/* =====================================================
   REPETICIÓN
===================================================== */

repeatBtn.addEventListener(
  'click',
  () => {

    if (
      repeatMode ===
      'off'
    ) {

      repeatMode =
        'all';


      setButtonIcon(
        repeatBtn,
        ICONS.repeat,
        'Repetir todo'
      );

    }

    else if (
      repeatMode ===
      'all'
    ) {

      repeatMode =
        'one';


      setButtonIcon(
        repeatBtn,
        ICONS.repeatOne,
        'Repetir una'
      );

    }

    else {

      repeatMode =
        'off';


      setButtonIcon(
        repeatBtn,
        ICONS.repeatOff,
        'Repetición desactivada'
      );

    }

  }
);


/* =====================================================
   CANCIÓN TERMINADA
===================================================== */

player.addEventListener(
  'ended',
  () => {

    switch (
      repeatMode
    ) {

      case 'one':

        player.currentTime =
          0;

        playTrack();

        break;


      case 'all':

        currentIndex =
          (
            currentIndex + 1
          ) %
          playlist.length;


        loadTrack(
          currentIndex
        );


        playTrack();

        break;


      case 'off':

        if (
          currentIndex + 1 <
          playlist.length
        ) {

          currentIndex++;

          loadTrack(
            currentIndex
          );

          playTrack();

        }

        else {

          pauseTrack();

        }

        break;

    }

  }
);


/* =====================================================
   SELECCIONAR CARPETA
===================================================== */

selectFolderBtn.addEventListener(
  'click',
  () => {

    folderInput.click();

  }
);


/* =====================================================
   CARGAR CARPETA
===================================================== */

folderInput.addEventListener(
  'change',
  () => {

    playlist =
      Array.from(
        folderInput.files
      )

      .filter(
        f =>
          f.type.startsWith(
            'audio/'
          )
      )

      .map(
        f => ({

          file:
            f,

          title:
            f.name,

          artist:
            'Desconocido',

          cover:
            null

        })
      );


    /*
      Orden alfabético.
    */

    playlist.sort(
      (a,b) =>
        a.title.localeCompare(
          b.title
        )
    );


    currentIndex =
      0;


    /*
      Leer metadata.
    */

    playlist.forEach(
      (song,index) => {

        jsmediatags.read(
          song.file,
          {

            onSuccess:
              function(tag) {

                /*
                  TÍTULO
                */

                if (
                  tag.tags.title
                ) {

                  song.title =
                    tag.tags.title;

                }


                /*
                  ARTISTA
                */

                if (
                  tag.tags.artist
                ) {

                  song.artist =
                    tag.tags.artist;

                }


                /*
                  PORTADA
                */

                if (
                  tag.tags.picture
                ) {

                  let base64 =
                    '';


                  for (
                    let i = 0;
                    i <
                    tag.tags.picture.data.length;
                    i++
                  ) {

                    base64 +=
                      String.fromCharCode(
                        tag.tags.picture.data[i]
                      );

                  }


                  song.cover =
                    `data:${tag.tags.picture.format};base64,${btoa(base64)}`;


                  /*
                    Si es la canción actual.
                  */

                  if (
                    index ===
                    currentIndex
                  ) {

                    showRealCover(
                      song.cover
                    );


                    updateBackground(
                      song.cover
                    );

                  }

                }

                else if (
                  index ===
                  currentIndex
                ) {

                  showNoCover();

                }


                updatePlaylistUI();

              },


            onError:
              function() {

                if (
                  index ===
                  currentIndex
                ) {

                  showNoCover();

                  updateBackground(
                    null
                  );

                }


                updatePlaylistUI();

              }

          }
        );

      }
    );


    /*
      Cargar primera canción.
    */

    if (
      playlist.length
    ) {

      loadTrack(
        0
      );

      playTrack();

    }


    updatePlaylistUI();

  }
);


/* =====================================================
   ACTUALIZAR PLAYLIST
===================================================== */

function updatePlaylistUI() {

  playlistContainer.innerHTML =
    '';


  if (
    !playlist.length
  ) {

    playlistContainer.innerHTML =
      '<div style="text-align:center; color:#fff;">No hay canciones seleccionadas</div>';

    return;

  }


  playlist.forEach(
    (song,i) => {

      const div =
        document.createElement(
          'div'
        );


      div.className =
        'playlist-item' +
        (
          i ===
          currentIndex
            ? ' active'
            : ''
        );


      /*
        IMAGEN
      */

      const img =
        document.createElement(
          'img'
        );


      if (
        song.cover
      ) {

        img.src =
          song.cover;

      }

      else {

        /*
          Mini portada improvisada.
        */

        img.src =
          'data:image/svg+xml,' +
          encodeURIComponent(`

            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="40"
              height="40"
              viewBox="0 0 40 40"
            >

              <rect
                width="40"
                height="40"
                fill="#000"
              />

              <circle
                cx="20"
                cy="20"
                r="10"
                fill="none"
                stroke="#fff"
                stroke-width="1"
                opacity="0.8"
              />

              <path
                d="M20 12 V27"
                stroke="#fff"
                stroke-width="2"
                stroke-linecap="round"
              />

              <circle
                cx="17"
                cy="29"
                r="3"
                fill="#fff"
              />

              <circle
                cx="27"
                cy="29"
                r="3"
                fill="#fff"
              />

            </svg>

          `);

      }


      /*
        TEXTO
      */

      const text =
        document.createElement(
          'div'
        );


      text.className =
        'text';


      const t =
        document.createElement(
          'div'
        );


      t.className =
        'song-title';


      t.textContent =
        song.title;


      const a =
        document.createElement(
          'div'
        );


      a.className =
        'song-artist';


      a.textContent =
        song.artist;


      text.appendChild(
        t
      );


      text.appendChild(
        a
      );


      div.appendChild(
        img
      );


      div.appendChild(
        text
      );


      /*
        CLICK
      */

      div.addEventListener(
        'click',
        () => {

          currentIndex =
            i;

          loadTrack(
            i
          );

          playTrack();

        }
      );


      playlistContainer.appendChild(
        div
      );

    }
  );

}


/* =====================================================
   REDIMENSIONAR VISUALIZADOR
===================================================== */

window.addEventListener(
  'resize',
  () => {

    if (
      !isPlaying
    )
      return;


    if (
      !playlist.length
    )
      return;


    if (
      !playlist[currentIndex].cover
    ) {

      drawVisualizer();

    }

  }
);


/* =====================================================
   ESTADO INICIAL
===================================================== */

setButtonIcon(
  playBtn,
  ICONS.play,
  'Reproducir'
);


setButtonIcon(
  repeatBtn,
  ICONS.repeatOff,
  'Repetición desactivada'
);


showNoCover();


updateBackground(
  null
);

</script>

</body>
</html>
